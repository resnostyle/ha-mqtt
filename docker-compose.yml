# Example sidecar services next to Home Assistant / Mosquitto.
# Copy env from .env.example (weather) and .env.pinger.example (pinger).

services:
  weather:
    image: ghcr.io/resnostyle/ha-mqtt:latest
    # build:
    #   context: .
    #   dockerfile: Dockerfile.weather
    container_name: ha-mqtt-weather
    restart: unless-stopped
    network_mode: host
    env_file:
      - .env

  pinger:
    image: ghcr.io/resnostyle/ha-mqtt/pinger:latest
    # build:
    #   context: .
    #   dockerfile: Dockerfile.pinger
    container_name: ha-mqtt-pinger
    restart: unless-stopped
    network_mode: host
    env_file:
      - .env.pinger
    # Required for PING_METHOD=icmp:
    # cap_add:
    #   - NET_RAW
