# Example sidecar next to Home Assistant / Mosquitto.
# Copy env from .env.example and point image at your build or registry.

services:
  weather-mqtt:
    image: ghcr.io/resnostyle/weather-mqtt:latest
    # build: .   # local override
    container_name: weather-mqtt
    restart: unless-stopped
    network_mode: host
    env_file:
      - .env
