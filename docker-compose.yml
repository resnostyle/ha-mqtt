# Example sidecar services next to Home Assistant / Mosquitto.
# Copy env from .env.example (weather), .env.pinger.example (pinger),
# .env.monitor.example (monitor), and .env.speedtest.example (speedtest).

services:
  weather:
    image: ghcr.io/resnostyle/ha-mqtt/weather:latest
    # build:
    #   context: .
    #   dockerfile: Dockerfile
    #   args:
    #     SERVICE: weather
    #     RUNTIME: distroless
    container_name: ha-mqtt-weather
    restart: unless-stopped
    network_mode: host
    env_file:
      - .env

  pinger:
    image: ghcr.io/resnostyle/ha-mqtt/pinger:latest
    # build:
    #   context: .
    #   dockerfile: Dockerfile
    #   args:
    #     SERVICE: pinger
    #     RUNTIME: alpine
    container_name: ha-mqtt-pinger
    restart: unless-stopped
    network_mode: host
    env_file:
      - .env.pinger
    # Required for PING_METHOD=icmp:
    # cap_add:
    #   - NET_RAW

  monitor:
    image: ghcr.io/resnostyle/ha-mqtt/monitor:latest
    # build:
    #   context: .
    #   dockerfile: Dockerfile
    #   args:
    #     SERVICE: monitor
    #     RUNTIME: alpine
    container_name: ha-mqtt-monitor
    restart: unless-stopped
    network_mode: host
    env_file:
      - .env.monitor
    # Required for MONITOR_METHOD=icmp (default):
    # cap_add:
    #   - NET_RAW

  speedtest:
    image: ghcr.io/resnostyle/ha-mqtt/speedtest:latest
    # build:
    #   context: .
    #   dockerfile: Dockerfile
    #   args:
    #     SERVICE: speedtest
    #     RUNTIME: distroless
    container_name: ha-mqtt-speedtest
    restart: unless-stopped
    network_mode: host
    env_file:
      - .env.speedtest
