[tools]
go = "1.24"

[env]
_.path = ["{{config_root}}/bin"]

[tasks.test]
run = "go test ./..."

[tasks.weather]
run = "go run ./cmd/weather"
env = { _.file = ".env" }

[tasks.pinger]
run = "go run ./cmd/pinger"
# Shared .env uses weather MQTT_TOPIC_PREFIX / MQTT_CLIENT_ID; override for pinger.
env = { _.file = ".env", MQTT_TOPIC_PREFIX = "home/ping", MQTT_CLIENT_ID = "pinger-mqtt" }

[tasks.build]
run = [
  "go build -o bin/weather ./cmd/weather",
  "go build -o bin/pinger ./cmd/pinger",
]
